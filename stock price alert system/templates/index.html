<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Alert Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="container">
        <header>
            <div>
                <h1>StockAlert <span>Pro</span></h1>
                <p>Real-time autonomous monitoring</p>
            </div>
            <button class="btn-primary" id="addStockBtn">+ Add Stock</button>
        </header>

        <section class="dashboard">
            <div class="grid" id="stockGrid">
                <!-- Stock cards injected here via JS -->
            </div>
        </section>
    </div>

    <!-- Add Stock Modal -->
    <div class="modal-backdrop hidden" id="modal">
        <div class="modal">
            <h2>Track New Stock</h2>
            <form id="addStockForm">
                <div class="input-group">
                    <label>Select Stock</label>
                    <div class="stock-chips">
                        <label class="stock-chip">
                            <input type="radio" name="stockSymbol" value="SBIN.NS" required>
                            <span>SBI</span>
                        </label>
                        <label class="stock-chip">
                            <input type="radio" name="stockSymbol" value="HDFCBANK.NS">
                            <span>HDFC Bank</span>
                        </label>
                        <label class="stock-chip">
                            <input type="radio" name="stockSymbol" value="RELIANCE.NS">
                            <span>Reliance</span>
                        </label>
                        <label class="stock-chip">
                            <input type="radio" name="stockSymbol" value="INFY.NS">
                            <span>Infosys</span>
                        </label>
                        <label class="stock-chip">
                            <input type="radio" name="stockSymbol" value="TCS.NS">
                            <span>TCS</span>
                        </label>
                    </div>
                </div>
                <div class="input-group">
                    <label>Target Price</label>
                    <input type="number" id="priceInp" step="0.05" required>
                </div>
                <div class="input-group">
                    <label>Alert Trigger Type</label>
                    <select id="typeInp">
                        <option value="above">Above Target (≥)</option>
                        <option value="below">Below Target (≤)</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Start Tracking</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
